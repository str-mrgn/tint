name: srv6-lab

topology:
  nodes:
    # --- End Hosts ---
    host01:
      kind: linux
      image: wbitt/network-multitool:latest
      exec:
        - ip -4 addr add 192.168.1.1/24 dev eth1
        - ip -4 route replace default via 192.168.1.254 dev eth1

    host02:
      kind: linux
      image: wbitt/network-multitool:latest
      exec:
        - ip -4 addr add 192.168.2.1/24 dev eth1
        - ip -4 route replace default via 192.168.2.254 dev eth1

    # --- Control Plane & Monitoring Servers ---
    gobgp-server:
      kind: linux
      image: srv6-router:latest
      mgmt-ipv4: 172.20.20.10
      binds:
        - ./bin:/root/bin
        - ./configs:/root/configs
      exec:
        - /root/configs/scripts/init_gobgp_server.sh

    syslog:
      kind: linux
      image: wbitt/network-multitool:latest
      mgmt-ipv4: 172.20.20.20
      exec:
        - sh -c "nc -ulp 514 > /var/log/syslog_alert.log 2>&1 &"

    pola:
      kind: linux
      image: ghcr.io/nttcom/pola:latest-debug
      mgmt-ipv4: 172.20.20.30
      binds:
        - ./configs/pola/polad.yaml:/pola/polad.yaml
        - ./configs/pola/policy-color100.yaml:/pola/policy-color100.yaml
        - ./configs/pola/policy-color200.yaml:/pola/policy-color200.yaml
      exec:
        - sh -c "polad -f /pola/polad.yaml &"

    # --- SRv6 Routers ---
    router1:
      kind: linux
      image: srv6-router:latest
      mgmt-ipv4: 172.20.20.100
      binds:
        - ./bin:/root/bin
        - ./configs:/root/configs
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv4.conf.default.rp_filter: 0
        net.ipv6.conf.all.forwarding: 1
        net.ipv6.conf.all.seg6_enabled: 1
        net.ipv6.conf.default.seg6_enabled: 1
      exec:
        - sysctl -w net.ipv6.conf.eth1.seg6_enabled=1
        - sysctl -w net.ipv6.conf.lo.seg6_enabled=1
        - ip addr add 10.0.1.1/32 dev lo
        - ip -4 addr add 192.168.1.254/24 dev eth2
        - ip -6 addr add 2001:db8:12::1/64 dev eth1
        - ip -6 addr add 2001:db8:1::1/128 dev lo
        - ip -6 route add 2001:db8:23::/64 via 2001:db8:12::2 dev eth1
        - ip -6 route add 2001:db8:24::/64 via 2001:db8:12::2 dev eth1
        - ip -6 route add 2001:db8:35::/64 via 2001:db8:12::2 dev eth1
        - ip -6 route add 2001:db8:45::/64 via 2001:db8:12::2 dev eth1
        - ip -6 route add 2001:db8:2::1/128 via 2001:db8:12::2 dev eth1
        - ip -6 route add 2001:db8:3::1/128 via 2001:db8:12::2 dev eth1
        - ip -6 route add 2001:db8:4::1/128 via 2001:db8:12::2 dev eth1
        - ip -6 route add 2001:db8:5::1/128 via 2001:db8:12::2 dev eth1
        - ip -6 route add 2001:db8:1::100/128 encap seg6local action End.DX4 nh4 192.168.1.1 dev eth2
        - /root/configs/scripts/init_router1.sh

    router2:
      kind: linux
      image: srv6-router:latest
      sysctls:
        net.ipv6.conf.all.forwarding: 1
        net.ipv6.conf.all.seg6_enabled: 1
        net.ipv6.conf.default.seg6_enabled: 1
      exec:
        - sysctl -w net.ipv6.conf.eth1.seg6_enabled=1
        - sysctl -w net.ipv6.conf.eth2.seg6_enabled=1
        - sysctl -w net.ipv6.conf.eth3.seg6_enabled=1
        - sysctl -w net.ipv6.conf.lo.seg6_enabled=1
        - ip -6 addr add 2001:db8:12::2/64 dev eth1
        - ip -6 addr add 2001:db8:23::1/64 dev eth2
        - ip -6 addr add 2001:db8:24::1/64 dev eth3
        - ip -6 addr add 2001:db8:2::1/128 dev lo
        - ip -6 route add 2001:db8:1::/64 via 2001:db8:12::1 dev eth1
        - ip -6 route add 2001:db8:3::1/128 via 2001:db8:23::2 dev eth2
        - ip -6 route add 2001:db8:4::1/128 via 2001:db8:24::2 dev eth3
        - ip -6 route add 2001:db8:5::/64 via 2001:db8:23::2 dev eth2
        - ip -6 route add 2001:db8:35::/64 via 2001:db8:23::2 dev eth2
        - ip -6 route add 2001:db8:45::/64 via 2001:db8:24::2 dev eth3
        - ip -6 route add 2001:db8:2::1/128 encap seg6local action End dev lo

    router3:
      kind: linux
      image: srv6-router:latest
      sysctls:
        net.ipv6.conf.all.forwarding: 1
        net.ipv6.conf.all.seg6_enabled: 1
        net.ipv6.conf.default.seg6_enabled: 1
      exec:
        - sysctl -w net.ipv6.conf.eth1.seg6_enabled=1
        - sysctl -w net.ipv6.conf.eth2.seg6_enabled=1
        - sysctl -w net.ipv6.conf.lo.seg6_enabled=1
        - ip -6 addr add 2001:db8:23::2/64 dev eth1
        - ip -6 addr add 2001:db8:35::1/64 dev eth2
        - ip -6 addr add 2001:db8:3::1/128 dev lo
        - ip -6 route add 2001:db8:12::/64 via 2001:db8:23::1 dev eth1
        - ip -6 route add 2001:db8:1::/64 via 2001:db8:23::1 dev eth1
        - ip -6 route add 2001:db8:2::1/128 via 2001:db8:23::1 dev eth1
        - ip -6 route add 2001:db8:5::/64 via 2001:db8:35::2 dev eth2
        - ip -6 route add 2001:db8:3::1/128 encap seg6local action End dev lo

    router4:
      kind: linux
      image: srv6-router:latest
      sysctls:
        net.ipv6.conf.all.forwarding: 1
        net.ipv6.conf.all.seg6_enabled: 1
        net.ipv6.conf.default.seg6_enabled: 1
      exec:
        - sysctl -w net.ipv6.conf.eth1.seg6_enabled=1
        - sysctl -w net.ipv6.conf.eth2.seg6_enabled=1
        - sysctl -w net.ipv6.conf.lo.seg6_enabled=1
        - ip -6 addr add 2001:db8:24::2/64 dev eth1
        - ip -6 addr add 2001:db8:45::1/64 dev eth2
        - ip -6 addr add 2001:db8:4::1/128 dev lo
        - ip -6 route add 2001:db8:12::/64 via 2001:db8:24::1 dev eth1
        - ip -6 route add 2001:db8:1::/64 via 2001:db8:24::1 dev eth1
        - ip -6 route add 2001:db8:2::1/128 via 2001:db8:24::1 dev eth1
        - ip -6 route add 2001:db8:5::/64 via 2001:db8:45::2 dev eth2
        - ip -6 route add 2001:db8:4::1/128 encap seg6local action End dev lo

    router5:
      kind: linux
      image: srv6-router:latest
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv4.conf.default.rp_filter: 0
        net.ipv6.conf.all.forwarding: 1
        net.ipv6.conf.all.seg6_enabled: 1
        net.ipv6.conf.default.seg6_enabled: 1
      exec:
        - sysctl -w net.ipv6.conf.eth1.seg6_enabled=1
        - sysctl -w net.ipv6.conf.eth2.seg6_enabled=1
        - sysctl -w net.ipv6.conf.lo.seg6_enabled=1
        - ip -6 addr add 2001:db8:35::2/64 dev eth1
        - ip -6 addr add 2001:db8:45::2/64 dev eth2
        - ip -4 addr add 192.168.2.254/24 dev eth3
        - ip -6 addr add 2001:db8:5::1/128 dev lo
        - ip -6 route add 2001:db8:1::/64 via 2001:db8:35::1 dev eth1
        - ip -6 route add 2001:db8:2::1/128 via 2001:db8:35::1 dev eth1
        - ip -6 route add 2001:db8:3::1/128 via 2001:db8:35::1 dev eth1
        - ip -6 route add 2001:db8:4::1/128 via 2001:db8:45::1 dev eth2
        - ip -6 route add 2001:db8:5::100/128 encap seg6local action End.DX4 nh4 192.168.2.1 dev eth3
        - ip route add 192.168.1.0/24 encap seg6 mode encap segs 2001:db8:3::1,2001:db8:2::1,2001:db8:1::100 dev eth1

  links:
    - endpoints: ["host01:eth1", "router1:eth2"]
    - endpoints: ["router1:eth1", "router2:eth1"]
    - endpoints: ["router2:eth2", "router3:eth1"]
    - endpoints: ["router2:eth3", "router4:eth1"]
    - endpoints: ["router3:eth2", "router5:eth1"]
    - endpoints: ["router4:eth2", "router5:eth2"]
    - endpoints: ["router5:eth3", "host02:eth1"]
